<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>個人網站</title>
    <style>
        /* 基本樣式 */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        /* 主要內容區域 */
        .container {
            padding: 30px;
        }

        .photo-container {
            margin-bottom: 30px;
        }

        .photo-container img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #333;
        }

        .section-title {
            font-size: 1.5rem;
            margin: 20px 0;
            color: #333;
        }

        /* PDF 連結樣式 */
        .pdf-list {
            list-style-type: none;
            padding: 0;
        }

        .pdf-list li {
            margin: 10px 0;
        }

        .pdf-list a {
            color: #007BFF;
            text-decoration: none;
            font-size: 1.1rem;
        }

        .pdf-list a:hover {
            text-decoration: underline;
        }

        /* 頁腳 */
        footer {
            background-color: #333;
            color: white;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- 頁首 -->
    <header>
        <h1>歡迎來到我的個人網站</h1>
    </header>

    <!-- 主要內容區 -->
    <div class="container">

        <!-- 個人照片 -->
        <div class="photo-container">
            <img src="myphoto.jpg" alt="我的照片">
        </div>

        <p>你好！我是 [你的名字]，這裡是我展示的一些作品。</p>

        <!-- 作品區 -->
        <div class="section-title">我的作品</div>
        <ul class="pdf-list">
            <li><a href="works/work1.pdf" target="_blank">作品 1</a></li>
            <li><a href="works/work2.pdf" target="_blank">作品 2</a></li>
            <li><a href="works/work3.pdf" target="_blank">作品 3</a></li>
        </ul>
    </div>

    <!-- 頁尾 -->
    <footer>
        <p>© 2025 [你的名字] - 版權所有</p>
    </footer>

</body>
</html>
