<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人網站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            padding: 20px;
        }
        .photo {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
        }
        .about {
            margin-top: 20px;
            line-height: 1.6;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

<header>
    <h1>歡迎來到我的網站</h1>
</header>

<main>
    <section>
        <h2>我的照片</h2>
        <img src="your-photo.jpg" alt="我的照片" class="photo">
    </section>

    <section class="about">
        <h2>關於我</h2>
        <p>這是我個人網站的一部分。這裡會展示我的照片、介紹和一些聯絡資訊。</p>
    </section>
</main>

<footer>
    <p>&copy; 2025 我的網站. All rights reserved.</p>
</footer>

</body>
</html>
