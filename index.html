<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人網站</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            padding: 20px;
        }
        .photo {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 10px;
        }
        .about {
            margin-top: 20px;
            line-height: 1.8;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>

<body>

<header>
    <h1>歡迎來到我的個人網站</h1>
</header>

<main>
    <section>
        <h2>我的照片</h2>
        <img src="your-photo.jpg" alt="我的照片" class="photo">
    </section>

    <section class="about">
        <h2>關於我</h2>
        <p>嗨！我是小志，一名熱愛動物與大自然的動物園員。目前在台北市立動物園工作，主要負責照顧哺乳類與鳥類動物。每天能和各種可愛又獨特的生物相處，是我最幸福的事。</p>
        <p>除了照顧牠們的飲食與健康，我也致力於推廣動物保育與環境教育，讓更多人了解野生動物面臨的挑戰。希望透過我的努力，能讓人與動物共生的世界更近一步！</p>
    </section>
</main>
